name: Bug report
description: Report a defect in tai42-kit (leaf helpers, settings, pooled clients, LLM factories)
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or code that reproduce the problem.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tai42-kit version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and the tai42-kit extras you have installed (e.g. redis, postgres, anthropic) with relevant backend versions.
      placeholder: "Python 3.13.x, macOS 15, tai42-kit[redis,anthropic]"
    validations:
      required: true
